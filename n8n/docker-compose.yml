# Production stack for Hetzner VPS.
# Runs: n8n + Redis + Caddy (auto-HTTPS)
# Deploy: scp this folder to VPS → docker compose up -d
version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: malikas-n8n
    restart: always
    ports:
      - '127.0.0.1:5678:5678' # only Caddy talks to it
    environment:
      - N8N_HOST=n8n.malikasuniverse.com
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n.malikasuniverse.com/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${SUPABASE_DB_HOST}
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=n8n
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GENERIC_TIMEZONE=Asia/Qatar
      - TZ=Asia/Qatar
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=720 # 30 days
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro

  redis:
    image: redis:7-alpine
    container_name: malikas-redis
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  caddy:
    image: caddy:2-alpine
    container_name: malikas-caddy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  n8n-data:
  redis-data:
  caddy-data:
  caddy-config:
